name: egg_timer
description: A cute, scalable egg timer app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (scalable, testable)
  flutter_riverpod: ^2.5.1

  # Routing (optional now, useful as app grows)
  go_router: ^14.2.0

  # SVG support (perfect for Figma exports)
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/illustrations/
