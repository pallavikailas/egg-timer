<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Egg Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>🥚 Egg Timer</h1>

    <div class="timer" id="time">05:00</div>

    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>

    <div class="presets">
      <button data-min="4">Soft (4m)</button>
      <button data-min="6">Medium (6m)</button>
      <button data-min="9">Hard (9m)</button>
    </div>

    <div class="controls">
      <button id="start">Start</button>
      <button id="pause" disabled>Pause</button>
      <button id="reset">Reset</button>
    </div>

    <p class="hint">Tip: pick a preset, then press Start.</p>
  </main>

  <audio id="ding" src="ding.mp3" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
